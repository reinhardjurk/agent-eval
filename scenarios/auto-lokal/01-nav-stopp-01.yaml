id: nav-stopp-01
setting: Du sitzt im Auto (als Fahrer oder Beifahrer) und sprichst per Sprachsteuerung mit 'Nova', dem
  Sprachassistenten des Fahrzeugs.
persona: Musikliebhaber, 34, Vinyl-Nostalgiker; benutzt altmodische Begriffe wie 'Sender' und 'Kassette'.
goal: Du faehrst nach Heidelberg, zu einem Klassentreffen nach zwanzig Jahren. Unterwegs willst du an
  einem Restaurant halten. Die Navigation soll gestartet und der Zwischenstopp fest eingeplant werden.
constraints: Du nennst erst das Ziel und kommst erst danach mit dem Essenswunsch.
opening_message: Wir muessen nach Heidelberg, und irgendwann brauch ich unterwegs was zu essen.
max_turns: 8
success_criteria:
  tool_calls:
  - tool: start_navigation
    with_args:
      destination: '*heidelberg*'
  - tool: add_stopover
