# Zelle 2: Modellvergleich — kleines lokales Modell, sonst identisch
id: auto-lokal-llama
model: ollama/llama3.2:3b

agents:
  - cards/navigation-agent.json
  - cards/entertainment-agent.json
  - cards/comfort-agent.json

mcp:
  - server: mcp/car-server.yaml

context:
  system_prompt: prompts/car-concierge.md
  customer_context: none

sampling:
  max_tokens: 2048

simulator:
  model: ollama/gemma4:latest

repetitions: 1
