[project]
name = "agent-eval"
version = "0.1.0"
description = "Systematische Evaluation eines Multi-Agenten-Sprachassistenten (Qualitaet, Latenz, Tokenverbrauch) mit Langfuse-Tracing"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.100",
    "langfuse>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
