# Referenzkonfiguration – gegen diese wird verglichen.
id: baseline-opus5
model: claude-opus-5

agents:
  - cards/billing-agent.json
  - cards/account-agent.json

mcp:
  - server: mcp/crm-server.yaml
    # tools: [get_customer, get_invoices]   # optional: Untermenge testen; ohne Angabe = alle

context:
  system_prompt: prompts/concierge.md
