sampling:
  max_tokens: 1024
  effort: low                 # Voice: niedrige Latenz. low|medium|high|xhigh|max (nicht auf Haiku)

simulator:
  model: claude-opus-5

judge:
  model: claude-opus-5

repetitions: 3
